<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CSS 3D 正方体 - 红色与绿色面</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #1a1f2e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        /* 场景容器：透视 + 3D 空间 */
        .scene {
            width: 300px;
            height: 300px;
            perspective: 800px;
            cursor: grab;
        }

        .scene:active {
            cursor: grabbing;
        }

        /* 立方体容器 */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* 初始角度，方便看到多个面 */
            transform: rotateX(-20deg) rotateY(30deg);
            transition: transform 0.3s ease-out;
        }

        /* 所有面通用样式 */
        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0,0,0,0.2);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: visible;  /* 让背面也可见颜色，便于观察 */
        }

        /* 各面位置和颜色 */
        .front  { transform: translateZ(150px); background-color: #e74c3c; } /* 红 */
        .back   { transform: translateZ(-150px) rotateY(180deg); background-color: #2ecc71; } /* 绿 */
        .right  { transform: translateX(150px) rotateY(90deg); background-color: #e74c3c; } /* 红 */
        .left   { transform: translateX(-150px) rotateY(-90deg); background-color: #2ecc71; } /* 绿 */
        .top    { transform: translateY(-150px) rotateX(90deg); background-color: #e74c3c; } /* 红 */
        .bottom { transform: translateY(150px) rotateX(-90deg); background-color: #f1c40f; } /* 备用黄色，可改为绿 */

        /* 可选：给面加一点文字说明，更直观 */
        .front::after  { content: "红"; color: white; text-shadow: 0 0 5px black; }
        .back::after   { content: "绿"; color: white; text-shadow: 0 0 5px black; }
        .right::after  { content: "红"; color: white; text-shadow: 0 0 5px black; }
        .left::after   { content: "绿"; color: white; text-shadow: 0 0 5px black; }
        .top::after    { content: "红"; color: white; text-shadow: 0 0 5px black; }
        .bottom::after { content: "黄"; color: white; text-shadow: 0 0 5px black; }

        /* 鼠标拖动旋转效果（简单版）—— 实际可用 JS 实现更流畅，但为了纯展示，加一点交互动画 */
        .cube {
            animation: slowSpin 12s infinite linear;
        }

        @keyframes slowSpin {
            0%   { transform: rotateX(-20deg) rotateY(0deg); }
            100% { transform: rotateX(-20deg) rotateY(360deg); }
        }

        /* 小屏幕适配 */
        @media (max-width: 600px) {
            .scene { width: 200px; height: 200px; }
            .face { width: 200px; height: 200px; }
            .front  { transform: translateZ(100px); }
            .back   { transform: translateZ(-100px) rotateY(180deg); }
            .right  { transform: translateX(100px) rotateY(90deg); }
            .left   { transform: translateX(-100px) rotateY(-90deg); }
            .top    { transform: translateY(-100px) rotateX(90deg); }
            .bottom { transform: translateY(100px) rotateX(-90deg); }
            .face { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>
</body>
</html>
